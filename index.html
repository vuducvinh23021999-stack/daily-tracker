<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0"><meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate"><meta http-equiv="pragma" content="no-cache"><meta http-equiv="expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Tasks - Quản lý công việc hàng ngày</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0ebe3;
  --surface:#fff;
  --surface2:#f8f5f0;
  --text:#1f1d1a;
  --text2:#6b6358;
  --border:#e0d8c6;
  --primary:#b25a3a;
  --primary-light:#e89a7a;
  --primary-dark:#8a3e22;
  --success:#2e7d32;
  --danger:#b71c1c;
  --warning:#f57f17;
  --shadow:0 2px 8px rgba(0,0,0,.06);
  --radius:12px;
  --radius-sm:8px;
  font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
body{background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:960px;margin:0 auto;padding:20px 16px 100px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.header h1{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.header h1 span{font-size:26px}
.header-right{display:flex;align-items:center;gap:10px}

.date-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.date-nav button{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;cursor:pointer;font-size:13px;color:var(--text)}
.date-nav .date-display{font-weight:600;font-size:15px;min-width:160px;text-align:center}

/* Stats bar */
.stats-bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center}
.stat-card .num{font-size:24px;font-weight:700;color:var(--primary)}
.stat-card .num.green{color:var(--success)}
.stat-card .num.red{color:var(--danger)}
.stat-card .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}

/* Progress bar */
.progress-wrap{background:var(--border);border-radius:999px;height:8px;overflow:hidden;margin-bottom:16px}
.progress-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--success),#66bb6a);transition:width .4s ease}

/* Add task */
.add-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.add-section .row{display:flex;flex-wrap:wrap;gap:8px}
.add-section .row>*{flex:1;min-width:120px}
.add-section input,.add-section select{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);font:inherit;font-size:14px;color:var(--text);width:100%}
.add-section .add-btn-row{display:flex;gap:8px;margin-top:8px}
.add-section .add-btn-row button{flex:1}

button{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 16px;border-radius:var(--radius-sm);font:inherit;font-size:13px;font-weight:500;transition:all .15s}
button:hover{opacity:.85}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.primary:hover{background:var(--primary-dark)}
button.small{padding:6px 10px;font-size:12px}
button.danger{color:var(--danger);border-color:var(--danger)}
button.danger:hover{background:var(--danger);color:#fff}

/* Task list */
.task-list{display:grid;gap:6px;margin-bottom:16px}
.category-header{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;padding:12px 4px 4px;display:flex;align-items:center;gap:6px}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:10px;transition:all .2s}
.task-card:hover{box-shadow:var(--shadow)}
.task-card .check-wrap{flex-shrink:0;width:24px;height:24px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
.task-card .check-wrap.done{background:var(--success);border-color:var(--success)}
.task-card .check-wrap.done::after{content:"✓";color:#fff;font-size:14px;font-weight:700}
.task-card .task-body{flex:1;min-width:0}
.task-card .task-title{font-size:14px;font-weight:500}
.task-card .task-title.done{text-decoration:line-through;color:var(--text2)}
.task-card .task-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.task-card .time-badge{font-size:11px;padding:2px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--border);color:var(--text2)}
.task-card.overdue{border-color:var(--danger);background:#fff5f5}
.task-card.overdue .time-badge{border-color:var(--danger);color:var(--danger);background:#ffe0e0}
@keyframes alertPulse{0%,100%{border-color:var(--danger);box-shadow:0 0 0 0 rgba(183,28,28,.35)}50%{box-shadow:0 0 0 6px rgba(183,28,28,0)}}
.task-card.alert-now{animation:alertPulse 1.5s ease infinite}
.task-card .cat-badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
.task-card .priority-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.task-card .task-actions{display:flex;gap:4px;flex-shrink:0}
.task-card .time{font-size:11px;color:var(--text2)}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px}
.tabs button{flex:1;border:none;background:transparent;padding:10px;border-radius:var(--radius-sm);font-weight:500;font-size:13px}
.tabs button.active{background:var(--primary);color:#fff}
.tab-content{display:none}
.tab-content.active{display:block}

/* History & Stats */
.stats-grid{display:grid;gap:16px}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.chart-wrap h3{font-size:14px;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.chart-wrap canvas{width:100%;height:200px;max-height:250px}
.period-select{display:flex;gap:4px;margin-bottom:12px}
.period-select button{flex:1;padding:6px;font-size:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:transparent}
.period-select button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:var(--surface);border-radius:var(--radius);padding:24px;width:90%;max-width:420px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal h3{font-size:16px;margin-bottom:16px}
.modal label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;margin-top:12px}
.modal input,.modal select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font:inherit;font-size:14px;background:var(--surface2);color:var(--text);box-sizing:border-box}
.modal .modal-actions{display:flex;gap:8px;margin-top:20px}
.modal .modal-actions button{flex:1}

.task-alert-overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:2000;pointer-events:none}
.task-alert{pointer-events:auto;background:var(--surface);border-radius:var(--radius);padding:40px 44px;width:560px;max-width:calc(100vw - 32px);box-shadow:0 14px 56px rgba(0,0,0,.3);border-left:10px solid var(--primary);animation:alertSlideUp .5s ease}
@keyframes alertSlideUp{0%{opacity:0;transform:translateY(30px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.task-alert .alarm{font-size:44px;display:inline-block;margin-right:12px;vertical-align:middle;animation:pop .8s ease infinite}
.task-alert h3{font-size:28px;color:var(--primary);display:inline}
.task-alert .at{font-size:18px;color:var(--text2);margin:16px 0 18px}
.task-alert .cat{font-size:15px;padding:7px 18px;border-radius:999px;background:var(--surface2);border:1px solid var(--border)}
.task-alert .actions{display:flex;gap:12px;margin-top:26px}
.task-alert .actions button{flex:1;padding:18px;font-size:20px}

.history-list .day-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px}
.history-list .day-group .day-head{display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;user-select:none;margin-bottom:0}
.history-list .day-group .day-head:hover{opacity:.85}
.history-list .day-group .day-head .chevron{display:inline-block;font-size:12px;color:var(--text2);transition:transform .15s;flex-shrink:0}
.history-list .day-group .day-head .date{font-weight:600;font-size:14px;flex:1}
.history-list .day-group .day-head .rate{font-size:13px;color:var(--text2);flex-shrink:0}
.history-list .day-group .day-body{display:none;margin-top:8px}
.history-list .day-group.open .day-body{display:block}
.history-list .day-group.open .day-head .chevron{transform:rotate(90deg)}
.history-list .day-group .h-task{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.history-list .day-group .h-task .h-dot{width:6px;height:6px;border-radius:50%;display:inline-block}

/* User bar */
.user-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user-bar .label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em}
.user-bar input{flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);font:inherit;font-size:13px}
.user-bar button{padding:8px 14px}
.online-status{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--text2)}
.online-status .dot{width:8px;height:8px;border-radius:50%}
.online-status .dot.green{background:var(--success)}
.online-status .dot.red{background:var(--danger)}

.empty-state{text-align:center;padding:40px 16px;color:var(--text2)}
.empty-state .icon{font-size:48px;margin-bottom:12px}
.empty-state p{font-size:14px}

@media(max-width:640px){
  .header h1{font-size:18px}
  .add-section .row>*{min-width:100%}
  .stats-bar{grid-template-columns:repeat(2,1fr)}
}

@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.pop{animation:pop .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.task-card{animation:fadeIn .2s ease}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <h1><span>📋</span> Daily Tasks</h1>
  <div class="header-right">
    <span class="online-status"><span class="dot" id="fb-dot"></span><span id="fb-text">Đang kết nối…</span></span>
  </div>
</div>

<div class="user-bar">
  <span class="label">Người dùng</span>
  <input type="text" id="me" placeholder="Gõ tên rồi Enter…" list="known-users">
  <datalist id="known-users"></datalist>
  <button id="save-me" class="primary">Lưu tên</button>
  <span id="who" style="font-size:13px;color:var(--text2)">Chưa đặt tên</span>
</div>

<div class="date-nav">
  <button id="prev-day">‹</button>
  <span class="date-display" id="date-display"></span>
  <button id="next-day">›</button>
  <button id="today-btn">Hôm nay</button>
</div>

<div class="stats-bar" id="stats-bar">
  <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">Tổng</div></div>
  <div class="stat-card"><div class="num green" id="stat-done">0</div><div class="label">Đã làm</div></div>
  <div class="stat-card"><div class="num red" id="stat-pending">0</div><div class="label">Còn lại</div></div>
  <div class="stat-card"><div class="num" id="stat-rate">0%</div><div class="label">Tỉ lệ</div></div>
  <div class="stat-card"><div class="num" id="stat-streak">0</div><div class="label">Streak</div></div>
  <div class="stat-card"><canvas id="mini-chart" width="60" height="60" style="width:50px;height:50px;margin:0 auto;display:block"></canvas><div class="label" style="margin-top:-4px">Hôm nay</div></div>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progress-bar" style="width:0%"></div></div>

<div class="add-section">
  <div class="row">
    <input type="text" id="task-input" placeholder="Thêm công việc…">
    <input type="time" id="task-time" style="min-width:100px;flex:0.5">
    <select id="cat-select"><option value="work">💼 Công việc</option><option value="study">📚 Học tập</option><option value="health">🏃 Sức khỏe</option><option value="personal">🧘 Cá nhân</option><option value="finance">💰 Tài chính</option><option value="other">📌 Khác</option></select>
    <select id="priority-select"><option value="high">🔴 Cao</option><option value="medium" selected>🟡 Trung bình</option><option value="low">🟢 Thấp</option></select>
  </div>
  <div class="add-btn-row">
    <button id="add-task" class="primary">+ Thêm</button>
    <button id="add-bulk">📝 Thêm nhiều</button>
    <button id="copy-prev">🔁 Lặp lại</button>
  </div>
</div>

<div class="tabs">
  <button class="active" data-tab="today">Hôm nay</button>
  <button data-tab="history">Lịch sử</button>
  <button data-tab="stats">Thống kê</button>
</div>

<div class="tab-content active" id="tab-today">
  <div id="task-list" class="task-list"></div>
  <div style="display:flex;gap:4px;margin-top:8px">
    <button id="clear-done" class="small danger">Xoá mục đã hoàn thành</button>
    <button id="clear-all" class="small danger">🗑️ Xoá ngày này</button>
    <button id="export-today" class="small">Xuất TXT</button>
    <button id="export-excel" class="small">📊 Xuất Excel</button>
    <button id="export-word" class="small">📝 Xuất Word</button>
  </div>
</div>

<div class="tab-content" id="tab-history">
  <div class="history-list" id="history-list"></div>
</div>

<div class="tab-content" id="tab-stats">
  <div class="period-select">
    <button data-period="week" class="active">Tuần</button>
    <button data-period="month">Tháng</button>
    <button data-period="year">Năm</button>
    <button data-period="all">Tất cả</button>
  </div>
  <div class="stats-grid">
    <div class="chart-wrap"><h3>📊 Tỉ lệ hoàn thành</h3><canvas id="rate-chart"></canvas></div>
    <div class="chart-wrap"><h3>📈 Số task theo ngày</h3><canvas id="daily-chart"></canvas><div style="display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:12px;color:var(--text2)"><span>🟢 Đã làm</span><span>🟤 Tổng</span></div></div>
    <div class="chart-wrap"><h3>🎯 Theo danh mục</h3><canvas id="cat-chart"></canvas><div id="cat-legend" style="margin-top:8px;text-align:center"></div></div>
  </div>
</div>

</div>



<script>
try{(function(){
  window.onerror=function(msg,src,line,col){try{
    var d=document.getElementById("fb-text");
    if(d)d.textContent="Lỗi: "+msg+" (dòng "+line+")";
    var dot=document.getElementById("fb-dot");
    if(dot)dot.className="dot red";
  }catch(e){}};
  const CATEGORIES = [
    {id:"work",label:"💼 Công việc",color:"#e53935"},
    {id:"study",label:"📚 Học tập",color:"#1e88e5"},
    {id:"health",label:"🏃 Sức khỏe",color:"#43a047"},
    {id:"personal",label:"🧘 Cá nhân",color:"#fb8c00"},
    {id:"finance",label:"💰 Tài chính",color:"#8e24aa"},
    {id:"other",label:"📌 Khác",color:"#757575"}
  ];
  const PRIORITIES = {high:{label:"🔴 Cao",color:"#e53935"},medium:{label:"🟡 TB",color:"#fb8c00"},low:{label:"🟢 Thấp",color:"#43a047"}};
  const FB_BASE="https://hagiang-planner-default-rtdb.firebaseio.com";

    function fbFetch(path,method,body){
    const enc=path?path.split("/").map(s=>encodeURIComponent(s)).join("/"):"";
    const url=FB_BASE+"/daily-tracker/"+enc+".json";
    if(!method||method==="GET"){
      return new Promise(function(resolve){
        var id="cb_"+Date.now();
        window[id]=function(data){resolve(data);cleanup()};
        var s=document.createElement("script");
        s.src=url+"?callback="+id+"&t="+Date.now();
        function cleanup(){delete window[id];if(s.parentNode)s.parentNode.removeChild(s)}
        s.onerror=function(){cleanup();resolve(null)};
        s.onload=function(){if(window[id]){cleanup();resolve(null)}};
        document.body.appendChild(s);
        setTimeout(function(){if(window[id]){cleanup();resolve(null)}},8000);
      });
    }
    return fetch(url,{method:method,body:body?JSON.stringify(body):void 0,headers:{"Content-Type":"application/json"}})
      .then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})
      .catch(function(e){console.error("fbFetch write error:",e.message,url);return null});
  }

  function saveToLocal(){
    try{localStorage.setItem("dt_tasks_"+me,JSON.stringify(tasks))}catch(e){}
  }
  function loadFromLocal(){
    try{
      const d=localStorage.getItem("dt_tasks_"+me);
      if(d){tasks=JSON.parse(d);return true}
    }catch(e){}
    return false;
  }

  const $ = (s,r=document)=>r.querySelector(s);
  const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
  const today = ()=>new Date().toISOString().slice(0,10);
  const fmtDate = d=>{const o=new Date(d+"T12:00:00");return o.toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"numeric",year:"numeric"})};
  const shortDate = d=>{const o=new Date(d+"T12:00:00");return o.toLocaleDateString("vi-VN",{day:"numeric",month:"numeric"})};
  const genId = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  let me = localStorage.getItem("dt_me")||"Vũ Đức Vinh";
  let tasks = {};
  let currentDate = today();
  let rateChart=null, dailyChart=null, catChart=null;
  let lastRenderSig="",lastPollSig="";

  // Firebase connection
  let pollTimer=null;
    function setStatus(cls,txt){
    const dot=$("#fb-dot"),t=$("#fb-text");
    if(dot)dot.className="dot "+(cls||"");
    if(t)t.textContent=txt;
  }
  function startPolling(name){
    if(pollTimer) clearInterval(pollTimer);
    if(!name) return;
    function doPoll(){
      fbFetch(name).then(function(data){
        if(data!==null){
          setStatus("green","Đã đồng bộ");
          const clean=Object.fromEntries(Object.entries(data||{}).filter(function(kv){return kv[0]!=="_categories"&&kv[0]!=="_routines"}));
          const psig=JSON.stringify(clean);
          if(psig!==lastPollSig){
            lastPollSig=psig;
            tasks=clean;
            saveToLocal();
            renderTasks();
            renderHistory("week");
            updateCharts("week");
          }
        }else{
          setStatus("red","Mất kết nối");
          if(Object.keys(tasks).length===0&&loadFromLocal()){renderTasks();renderHistory("week")}
        }
      }).catch(function(e){console.error("poll error:",e)});
    }
    doPoll();
    pollTimer=setInterval(doPoll,5000);
  }function saveTask(id,task){
    if(!me) return;
    tasks[id]=task;
    saveToLocal();
    fbFetch(me+"/"+id,"PUT",task);
  }

  function deleteTask(id){
    if(!me) return;
    delete tasks[id];
    saveToLocal();
    fbFetch(me+"/"+id,"DELETE");
  }

  function getDayTasks(date){
    return Object.entries(tasks).filter(([_,t])=>t.date===date).sort((a,b)=>a.createdAt-b.createdAt);
  }

  function getCompleted(dt){
    return getDayTasks(dt).filter(([_,t])=>t.done).length;
  }

  function getTotal(dt){
    return getDayTasks(dt).length;
  }

  function getDatesInRange(start,end){
    const dates=[];
    let d=new Date(start+"T12:00:00");
    const e=new Date(end+"T12:00:00");
    while(d<=e){dates.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}
    return dates;
  }

  function calcStreak(){
    let streak=0;
    let d=new Date();
    while(true){
      const ds=d.toISOString().slice(0,10);
      const ttl=getTotal(ds);
      if(ttl===0) break;
      const done=getCompleted(ds);
      if(done/ttl<1) break;
      streak++;
      d.setDate(d.getDate()-1);
    }
    return streak;
  }

  // Stats history
  function getHistory(period){
    const now=new Date();
    let start;
    switch(period){
      case"week":start=new Date(now);start.setDate(now.getDate()-6);break;
      case"month":start=new Date(now);start.setMonth(now.getMonth()-1);break;
      case"year":start=new Date(now);start.setFullYear(now.getFullYear()-1);break;
      default:start=new Date("2020-01-01");break;
    }
    const dates=getDatesInRange(start.toISOString().slice(0,10),today());
    return dates.map(d=>{
      const total=getTotal(d),done=getCompleted(d);
      return{date:d,total,done,rate:total?Math.round(done/total*100):0};
    });
  }

  function getCatData(date){
    const dayTasks=getDayTasks(date);
    const catCount={};
    CATEGORIES.forEach(c=>catCount[c.id]={total:0,done:0});
    dayTasks.forEach(([_,t])=>{
      const c=t.category||"other";
      if(!catCount[c]) catCount[c]={total:0,done:0};
      catCount[c].total++;
      if(t.done) catCount[c].done++;
    });
    return catCount;
  }

  // Sound
  let audioCtx=null;
  function initAudio(){if(!audioCtx) try{audioCtx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  function playSound(){
    try{
      if(!audioCtx) return;
      const osc=audioCtx.createOscillator();
      const gain=audioCtx.createGain();
      osc.connect(gain);gain.connect(audioCtx.destination);
      osc.frequency.value=880;osc.type="sine";
      gain.gain.setValueAtTime(.3,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.01,audioCtx.currentTime+.3);
      osc.start(audioCtx.currentTime);osc.stop(audioCtx.currentTime+.3);
    }catch(e){}
  }
  let alertNodes=[];
  function playAlert(){
    try{
      if(!audioCtx) return;
      const now=audioCtx.currentTime;
      const nodes=[];
      const melody=[523,587,659,784];
      for(let r=0;r<4;r++){
        melody.forEach((f,i)=>{
          const t0=now+r*2.1+i*0.28;
          [1,4.01].forEach((ratio,j)=>{
            const osc=audioCtx.createOscillator();
            const gain=audioCtx.createGain();
            osc.connect(gain);gain.connect(audioCtx.destination);
            osc.type="sine";
            osc.frequency.value=f*ratio;
            const vol=j===0?0.5:0.12;
            gain.gain.setValueAtTime(vol,t0);
            gain.gain.exponentialRampToValueAtTime(0.001,t0+0.35);
            osc.start(t0);osc.stop(t0+0.4);
            nodes.push(osc,gain);
          });
        });
      }
      alertNodes=alertNodes.concat(nodes);
    }catch(e){}
  }
  function stopAlertNow(){
    alertNodes.forEach(n=>{try{if(n.stop)n.stop();if(n.disconnect)n.disconnect()}catch(e){}});
    alertNodes=[];
  }

  function isOverdue(t){
    if(t.done||!t.scheduledTime||t.date!==today()) return false;
    const now=new Date();
    const [h,m]=t.scheduledTime.split(":").map(Number);
    const sched=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);
    return (now-sched)>0;
  }

  let alertTimer=null, alertBurstTimer=null, alertRound=0;
  let snoozedUntil={}, activePopup=null;

  function dueForAlert(id,t){
    if(t.done||!t.scheduledTime||t.date!==today()) return false;
    if(snoozedUntil[id]&&Date.now()<snoozedUntil[id]) return false;
    const now=new Date();
    const [h,m]=t.scheduledTime.split(":").map(Number);
    const sched=new Date(now.getFullYear(),now.getMonth(),now.getDate(),h,m);
    const diff=now-sched;
    if(diff<=0) return false;
    if(diff>60*60000) return false;
    return true;
  }

  function showTaskAlert(id,t){
    if(activePopup) return;
    activePopup=id;
    const c=CATEGORIES.find(x=>x.id===(t.category||"other"))||CATEGORIES[CATEGORIES.length-1];
    const ov=document.createElement("div");
    ov.className="task-alert-overlay";
    ov.id="task-alert-popup";
    ov.innerHTML=`
      <div class="task-alert">
        <div><span class="alarm">⏰</span><h3>${esc(t.title)}</h3></div>
        <div class="at">Đến giờ làm — ${t.scheduledTime||""} · ${fmtDate(today())}</div>
        <div><span class="cat">${c.label}</span></div>
        <div class="actions">
          <button id="alert-done" class="primary">✅ Đã làm</button>
          <button id="alert-snooze">⏳ 5 phút</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
    initAudio();
    ov.querySelector("#alert-done").addEventListener("click",()=>{
      toggleTask(id);
      activePopup=null;
      ov.remove();
      stopBurstAlert();
    });
    ov.querySelector("#alert-snooze").addEventListener("click",()=>{
      snoozedUntil[id]=Date.now()+300000;
      activePopup=null;
      ov.remove();
      stopBurstAlert();
    });
  }
  function closeTaskAlert(){
    if(!activePopup) return;
    activePopup=null;
    const ov=document.getElementById("task-alert-popup");
    if(ov) ov.remove();
  }

  function startBurstAlert(){
    stopBurstAlert();
    if(!me) return;
    const hasOverdue=Object.entries(tasks).some(([id,t])=>dueForAlert(id,t));
    if(!hasOverdue) return;
    alertRound++;
    if(alertRound>3) return;
    let count=0;
    function playRound(){
      if(count>=30||!Object.entries(tasks).some(([id,t])=>dueForAlert(id,t))){
        scheduleNextBurst();
        return;
      }
      playAlert();
      count++;
      alertBurstTimer=setTimeout(playRound,2000);
    }
    playRound();
  }

  function stopBurstAlert(){
    stopAlertNow();
    if(alertBurstTimer){clearTimeout(alertBurstTimer);alertBurstTimer=null}
    if(alertTimer){clearTimeout(alertTimer);alertTimer=null}
    alertRound=0;
  }

  function scheduleNextBurst(){
    if(alertBurstTimer){clearTimeout(alertBurstTimer);alertBurstTimer=null}
    if(!Object.entries(tasks).some(([id,t])=>dueForAlert(id,t))){alertRound=0;return}
    alertTimer=setTimeout(startBurstAlert,300000);
  }

  function checkOverdueTasks(){
    if(!me) return;
    const due=Object.entries(tasks).filter(([id,t])=>dueForAlert(id,t));
    if(due.length>0){
      if(!activePopup){
        due.sort((a,b)=>(a[1].scheduledTime||"9999").localeCompare(b[1].scheduledTime||"9999"));
        showTaskAlert(due[0][0],due[0][1]);
      }
      if(!alertTimer&&!alertBurstTimer) startBurstAlert();
    }else{
      closeTaskAlert();
      stopBurstAlert();
    }
    renderTasks();
  }

  function renderStats(){
    const dt=currentDate;
    const total=getTotal(dt);
    const done=getCompleted(dt);
    const pending=total-done;
    const rate=total?Math.round(done/total*100):0;
    const streak=calcStreak();
    $("#stat-total").textContent=total;
    $("#stat-done").textContent=done;
    $("#stat-pending").textContent=pending;
    $("#stat-rate").textContent=rate+"%";
    $("#stat-streak").textContent=streak;
    $("#progress-bar").style.width=rate+"%";
    const cv=$("#mini-chart");
    if(cv){
      const ctx=cv.getContext("2d");
      const w=cv.width,h=cv.height,cx=w/2,cy=h/2,r=22;
      ctx.clearRect(0,0,w,h);
      ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle="#e0d8c6";ctx.lineWidth=6;ctx.stroke();
      if(rate>0){
        ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,(-Math.PI/2)+(Math.PI*2*rate/100));ctx.strokeStyle="#2e7d32";ctx.lineWidth=6;ctx.lineCap="round";ctx.stroke();
      }
      ctx.fillStyle="var(--text)";ctx.font="bold 12px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(rate+"%",cx,cy);
    }
  }

            <button class="small danger" onclick="window.dtDel('${id}')" title="Xoá">🗑️</button>
          </div>
        `;
        card.querySelector(".check-wrap").addEventListener("click",()=>toggleTask(id));
        frag.appendChild(card);
      });
      host.appendChild(frag);
    });

    // Check pending alert
    const pending=getDayTasks(dt).filter(([_,t])=>!t.done).length;
    if(pending>0&&dt===today()){
      // Show pending count
    }
    renderStats();
  }

  function shortDate2(ts){
    const d=new Date(ts);
    return d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"});
  }

  function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}
  function escCsv(s){return `"${(s||"").replace(/"/g,'""')}"`}
  function getAllTasksFlat(){
    const all=Object.values(tasks).filter(t=>t.date);
    const dateMap={};
    all.forEach(t=>{
      if(!dateMap[t.date]) dateMap[t.date]=[];
      dateMap[t.date].push(t);
    });
    return Object.keys(dateMap).sort().map(d=>({date:d,items:dateMap[d].sort((a,b)=>a.createdAt-b.createdAt)}));
  }

    ov.querySelector("#copy-date").addEventListener("change",preview);
    ov.querySelector("#copy-todo").addEventListener("change",preview);
    ov.querySelectorAll(".copy-quick").forEach(b=>{
      b.addEventListener("click",()=>{
        const d=new Date();d.setDate(d.getDate()-parseInt(b.dataset.off));
        ov.querySelector("#copy-date").value=d.toISOString().slice(0,10);
        preview();
      });
    });
    preview();
    ov.querySelector("#copy-cancel").addEventListener("click",()=>ov.remove());
    ov.querySelector("#copy-save").addEventListener("click",()=>{
      const src=ov.querySelector("#copy-date").value;
      const onlyTodo=ov.querySelector("#copy-todo").checked;
      if(!src) return;
      let items=getDayTasks(src);
      if(onlyTodo) items=items.filter(([_,t])=>!t.done);
      if(items.length===0){setStatus("red","Không có task để copy");ov.remove();return}
      items.forEach(([_,t])=>{
        const id=genId();
        tasks[id]={title:t.title,category:t.category||"other",priority:t.priority||"medium",date:currentDate,scheduledTime:t.scheduledTime||null,done:false,completedAt:null,createdAt:Date.now()};
        saveTask(id,tasks[id]);
      });
      renderTasks();
      ov.remove();
      setStatus("green","Đã copy "+items.length+" task sang "+fmtDate(currentDate));
    });
    ov.addEventListener("click",e=>{if(e.target===ov) ov.remove()});
  }

  // History
  function renderHistory(period){
    const data=getHistory(period);
    const host=$("#history-list");
    if(data.length===0){host.innerHTML='<div class="empty-state"><div class="icon">📜</div><p>Chưa có dữ liệu</p></div>';return}

    host.innerHTML=data.slice().reverse().map(d=>{
      const pct=d.rate;
      const color=pct>=80?"var(--success)":pct>=50?"var(--warning)":"var(--danger)";
      const items=getDayTasks(d.date);
      return `<div class="day-group">
        <div class="day-head" title="Ấn để xem chi tiết">
          <span class="chevron">▸</span>
          <span class="date">${fmtDate(d.date)}</span>
          <span class="rate" style="color:${color}">${d.done}/${d.total} (${d.rate}%)</span>
        </div>
        <div class="day-body">
          ${d.total>0?'<div style="background:var(--border);border-radius:999px;height:4px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:'+color+';border-radius:999px"></div></div>':''}
          <div style="margin-top:8px;font-size:12px;color:var(--text2)">
            ${items.map(([_,t])=>{
              const c=CATEGORIES.find(x=>x.id===(t.category||"other"))||CATEGORIES[CATEGORIES.length-1];
              return `<div style="display:flex;align-items:center;gap:6px;padding:3px 0">
                <span style="width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;background:${t.done?'var(--success)':'var(--danger)'}"></span>
                <span style="flex:1;min-width:0">${esc(t.title)}</span>
                ${t.scheduledTime?`<span style="font-size:11px;color:var(--text2);white-space:nowrap">${t.scheduledTime}</span>`:""}
                <span style="font-size:11px;padding:2px 8px;border-radius:999px;background:${c.color}22;color:${c.color};white-space:nowrap">${c.label}</span>
                <span style="font-size:12px;flex-shrink:0">${t.done?"✅":"⏳"}</span>
              </div>`;
            }).join("")}
          </div>
        </div>
      </div>`;
    }).join("");
  }

  // Charts (canvas thuần, không cần thư viện ngoài)
  function setupCanvas(cv){
    const dpr=window.devicePixelRatio||1;
    const w=cv.clientWidth||cv.parentElement.clientWidth||400;
    const h=cv.clientHeight||200;
    cv.width=w*dpr;cv.height=h*dpr;
    const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);
    return {ctx,w,h};
  }
  function drawBars(cv,labels,values,colorFn){
    const {ctx,w,h}=setupCanvas(cv);
    if(!labels.length) return;
    const padL=26,padB=20,padT=8;
    const max=Math.max(1,...values);
    const bw=(w-padL)/labels.length;
    ctx.strokeStyle="#e0d8c6";ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,h-padB);ctx.lineTo(w,h-padB);ctx.stroke();
    labels.forEach((lb,i)=>{
      const bh=(h-padB-padT)*(values[i]/max);
      ctx.fillStyle=colorFn?colorFn(values[i]):"#b25a3a";
      ctx.fillRect(padL+i*bw+Math.max(2,bw*0.15),h-padB-bh,Math.max(2,bw*0.7),bh);
      ctx.fillStyle="#6b6358";ctx.font="10px sans-serif";ctx.textAlign="center";
      ctx.fillText(lb,padL+i*bw+bw/2,h-padB+12);
    });
  }
  function drawLines(cv,labels,series){
    const {ctx,w,h}=setupCanvas(cv);
    if(!labels.length) return;
    const padL=26,padB=20,padT=8;
    const max=Math.max(1,...series.map(s=>Math.max(...s.values)));
    ctx.strokeStyle="#e0d8c6";ctx.beginPath();ctx.moveTo(padL,padT);ctx.lineTo(padL,h-padB);ctx.lineTo(w,h-padB);ctx.stroke();
    const x=i=>padL+(labels.length>1?i*(w-padL-6)/(labels.length-1):0)+3;
    const y=v=>h-padB-(v/max)*(h-padB-padT);
    series.forEach(s=>{
      ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.beginPath();
      labels.forEach((_,i)=>{if(i===0)ctx.moveTo(x(i),y(s.values[i]));else ctx.lineTo(x(i),y(s.values[i]))});
      ctx.stroke();
      ctx.fillStyle=s.color;
      labels.forEach((_,i)=>{ctx.beginPath();ctx.arc(x(i),y(s.values[i]),2.5,0,Math.PI*2);ctx.fill()});
    });
    ctx.fillStyle="#6b6358";ctx.font="10px sans-serif";ctx.textAlign="center";
    labels.forEach((lb,i)=>ctx.fillText(lb,x(i),h-padB+12));
  }
  function drawDonut(cv,items){
    const {ctx,w,h}=setupCanvas(cv);
    const cx=w/2,cy=h/2,r=Math.min(w,h)/2-14;
    const total=items.reduce((a,b)=>a+b.value,0);
    if(total<=0){ctx.fillStyle="#e0d8c6";ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fill();return}
    let a=-Math.PI/2;
    items.forEach(it=>{
      const ang=it.value/total*Math.PI*2;
      ctx.fillStyle=it.color;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+ang);ctx.closePath();ctx.fill();
      a+=ang;
    });
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(cx,cy,r*0.55,0,Math.PI*2);ctx.fill();
  }
  function updateCharts(period){
    const data=getHistory(period);
    if(!data||data.length===0) return;
    const labels=data.map(d=>shortDate(d.date));
    drawBars($("#rate-chart"),labels,data.map(d=>d.rate),v=>v>=80?"#2e7d32":v>=50?"#f57f17":"#b71c1c");
    drawLines($("#daily-chart"),labels,[{color:"#2e7d32",values:data.map(d=>d.done)},{color:"#b25a3a",values:data.map(d=>d.total)}]);
    const cd=getCatData(currentDate);
    const items=CATEGORIES.filter(c=>cd[c.id]&&cd[c.id].total>0).map(c=>({label:c.label,color:c.color,value:cd[c.id].total,text:cd[c.id].done+"/"+cd[c.id].total}));
    drawDonut($("#cat-chart"),items);
    const lg=$("#cat-legend");
    if(lg) lg.innerHTML=items.map(it=>`<span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin:0 10px 6px 0"><span style="width:10px;height:10px;border-radius:2px;background:${it.color};display:inline-block"></span>${it.label} (${it.text})</span>`).join("");
  }

  // Navigate date
  function setDate(date){
    currentDate=date;
    $("#date-display").textContent=fmtDate(date);
    renderTasks();
    renderHistory("week");
    updateCharts("week");
  }

  // Init
  function initUser(name){
    if(!name) return;
    me=name.trim();
    localStorage.setItem("dt_me",me);
    loadFromLocal();
    startPolling(me);
    $("#me").value=me;
    $("#who").textContent="👤 "+me;
  }

  // Events
  $("#save-me").addEventListener("click",()=>{initAudio();initUser($("#me").value)});
  $("#me").addEventListener("keydown",e=>{if(e.key==="Enter"){initAudio();initUser($("#me").value)}});
  $("#add-task").addEventListener("click",()=>{
    addTask($("#task-input").value,$("#cat-select").value,$("#priority-select").value,currentDate,$("#task-time").value||null);
    $("#task-input").value="";
    $("#task-time").value="";
  });
  $("#task-input").addEventListener("keydown",e=>{
    if(e.key==="Enter"){$("#add-task").click()}
  });
  $("#add-bulk").addEventListener("click",()=>{initAudio();bulkAdd()});
  $("#copy-prev").addEventListener("click",()=>{initAudio();copyFromDay()});
  $("#prev-day").addEventListener("click",()=>{
    const d=new Date(currentDate+"T12:00:00");
    d.setDate(d.getDate()-1);
    setDate(d.toISOString().slice(0,10));
  });
  $("#next-day").addEventListener("click",()=>{
    const d=new Date(currentDate+"T12:00:00");
    d.setDate(d.getDate()+1);
    setDate(d.toISOString().slice(0,10));
  });
  $("#today-btn").addEventListener("click",()=>setDate(today()));
  $("#clear-done").addEventListener("click",()=>{
    getDayTasks(currentDate).filter(([_,t])=>t.done).forEach(([id])=>deleteTask(id));
    renderTasks();
  });
  $("#clear-all").addEventListener("click",()=>{
    const dayTasks=getDayTasks(currentDate);
    if(dayTasks.length===0) return setStatus("","Ngày này không có task để xoá");
    if(!confirm("Xoá tất cả "+dayTasks.length+" task của ngày "+fmtDate(currentDate)+"?\nViệc này không thể hoàn tác!")) return;
    if(!confirm("Chắc chắn chưa? Dữ liệu ngày này trên Firebase sẽ bị xoá hết!")) return;
    dayTasks.forEach(([id])=>deleteTask(id));
    renderTasks();
    renderHistory("week");
    updateCharts("week");
    setStatus("green","Đã xoá toàn bộ task ngày "+fmtDate(currentDate));
  });
  $("#export-today").addEventListener("click",()=>{
    const dt=currentDate;
    const items=getDayTasks(dt);
    let txt=`Công việc ngày ${fmtDate(dt)}\n${"=".repeat(40)}\n\n`;
    items.forEach(([_,t])=>{
      const st=t.done?"✓":"○";
      txt+=`${st} ${t.title} (${CATEGORIES.find(c=>c.id===(t.category||"other"))?.label||"Khác"})\n`;
    });
    txt+=`\n${getCompleted(dt)}/${getTotal(dt)} hoàn thành`;
    const blob=new Blob([txt],{type:"text/plain;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tasks-"+dt+".txt";a.click();
  });
  $("#export-excel").addEventListener("click",exportCSV);
  $("#export-word").addEventListener("click",exportWord);
  setInterval(checkOverdueTasks,5000);

  // History toggle: ấn vào ngày để xổ/giấu chi tiết
  $("#history-list").addEventListener("click",e=>{
    const head=e.target.closest(".day-head");
    if(!head) return;
    const g=head.closest(".day-group");
    if(g) g.classList.toggle("open");
  });

  // Tabs
  $$(".tabs button").forEach(btn=>{
    btn.addEventListener("click",()=>{
      $$(".tabs button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      $$(".tab-content").forEach(t=>t.classList.remove("active"));
      const tab=document.getElementById("tab-"+btn.dataset.tab);
      if(tab) tab.classList.add("active");
      if(btn.dataset.tab==="stats")updateCharts(document.querySelector(".period-select .active")?.dataset?.period||"week");
      if(btn.dataset.tab==="history")renderHistory("week");
    });
  });

  // Period select
  $$(".period-select button").forEach(btn=>{
    btn.addEventListener("click",()=>{
      $$(".period-select button").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      updateCharts(btn.dataset.period);
    });
  });

  // Known users
  fbFetch("","GET").then(data=>{
    if(!data) return;
    const names=Object.keys(data).filter(k=>!k.startsWith("_"));
    const dl=$("#known-users");if(!dl)return;
    dl.innerHTML="";
    names.forEach(n=>{const o=document.createElement("option");o.value=n;dl.appendChild(o)});
  }).catch(()=>{});

    // Auto-load
  function tryAutoConnect(){
    setStatus("","Đang tìm người dùng…");
    fbFetch("","GET").then(function(data){
      if(!data){setStatus("red","Không kết nối được Firebase");return}
      const names=Object.keys(data).filter(function(k){return !k.startsWith("_")});
      if(names.length===1){
        me=names[0];
        localStorage.setItem("dt_me",me);
        $("#me").value=me;
        initUser(me);
      }else if(names.length>1){
        setStatus("","Chọn tên rồi bấm Lưu tên");
        const dl=$("#known-users");
        if(dl){dl.innerHTML="";names.forEach(function(n){const o=document.createElement("option");o.value=n;o.textContent=n;dl.appendChild(o)})}
      }else{
        setStatus("","Nhập tên rồi bấm Lưu tên");
      }
    }).catch(function(e){setStatus("red","Lỗi: "+e.message)});
  }

  // Auto-load
  if(me){$("#me").value=me;initUser(me)}
  else{tryAutoConnect()}
  setDate(today());
})();}catch(e){console.error("App error:",e);try{var fb=document.getElementById("fb-text");if(fb)fb.textContent="Lỗi: "+e.message;var fd=document.getElementById("fb-dot");if(fd)fd.className="dot red";}catch(e2){}}
</script>
